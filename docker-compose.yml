# docker compose up -d --build
# With automatic HTTPS:  docker compose --profile https up -d --build   (set DOMAIN and TRUST_PROXY=1 in .env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pos_db}
      POSTGRES_USER: ${DB_USER:-pos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      TZ: ${APP_TIMEZONE:-Africa/Nairobi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: pos-classic-shop:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pos_db}
      DB_USER: ${DB_USER:-pos}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Nairobi}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_SHOP: ${SEED_SHOP:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SESSION_HOURS: ${SESSION_HOURS:-12}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:80"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in your .env file to use the https profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
